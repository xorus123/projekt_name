<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблиця лідерів — {{ quiz.title }}</title>
    <style>
        :root {
            --primary: #6366f1;
            --accent-orange: #f59e0b;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --table-header-bg: #f1f5f9;
        }

        [data-theme="dark"] {
            --primary: #818cf8;
            --bg-body: #0f172a;
            --card-bg: #1e293b;
            --text-dark: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --table-header-bg: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-body); color: var(--text-dark); min-height: 100vh; animation: fadeIn 0.5s ease-out; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        header { background: var(--card-bg); padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .theme-toggle-btn { background: var(--table-header-bg); border: 1px solid var(--border-color); color: var(--text-dark); width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 18px; }

        .container { max-width: 580px; margin: 40px auto; padding: 0 20px; animation: slideUp 0.5s ease-out; }
        .card { background: var(--card-bg); padding: 32px; border-radius: 18px; border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; }
        h2 { color: var(--accent-orange); margin-bottom: 20px; font-size: 26px; }

        table { width: 100%; border-collapse: collapse; margin: 20px 0; border-radius: 10px; overflow: hidden; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: var(--table-header-bg); font-weight: 700; color: var(--text-dark); }
        
        .btn-home { display: block; padding: 12px; background: var(--primary); color: white; text-decoration: none; border-radius: 10px; font-weight: 700; margin-top: 15px; transition: transform 0.2s; }
        .btn-home:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'index' %}" class="logo">🎯 QuizApp</a>
        <button id="themeToggle" class="theme-toggle-btn">🌙</button>
    </header>

    <div class="container">
        <div class="card">
            <h2>🏆 Таблиця лідерів 🏆</h2>
            <p style="color: var(--text-muted); font-weight: 600;">{{ quiz.title }}</p>

            <table>
                <thead>
                    <tr>
                        <th>Місце</th>
                        <th>Учасник</th>
                        <th>Результат</th>
                    </tr>
                </thead>
                <tbody>
                    {% for res in results %}
                    <tr>
                        <td><b>#{{ forloop.counter }}</b></td>
                        <td>{{ res.user.username }}</td>
                        <td><b>{{ res.score }}</b> / {{ res.total_questions }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" style="text-align: center; color: var(--text-muted);">Поки що немає результатів. Напиши тест першим!</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <a href="{% url 'index' %}" class="btn-home">← Повернутися на головну</a>
        </div>
    </div>

    <script>
        const btn = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            btn.textContent = '☀️';
        }
        btn.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
            btn.textContent = isDark ? '🌙' : '☀️';
        });
    </script>
</body>
</html>
