<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if edit_mode %}Редагування{% else %}Створення{% endif %} вікторини</title>
    <style>
        :root {
            --primary: #6366f1;
            --accent-green: #10b981;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
        }

        [data-theme="dark"] {
            --primary: #818cf8;
            --accent-green: #34d399;
            --bg-body: #0f172a;
            --card-bg: #1e293b;
            --text-dark: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-body); color: var(--text-dark); min-height: 100vh; animation: fadeIn 0.5s ease-out; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        header { background: var(--card-bg); padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .theme-toggle-btn { background: var(--bg-body); border: 1px solid var(--border-color); color: var(--text-dark); width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 18px; }

        .container { max-width: 480px; margin: 40px auto; padding: 0 20px; animation: slideUp 0.5s ease-out; }
        .card { background: var(--card-bg); padding: 32px; border-radius: 18px; border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h2 { color: var(--accent-green); margin-bottom: 20px; text-align: center; }

        form p { margin-bottom: 16px; }
        form label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 14px; }
        form input, form textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--input-bg); color: var(--text-dark); outline: none; }
        form input:focus, form textarea:focus { border-color: var(--primary); }

        .btn-submit { width: 100%; padding: 12px; background: var(--accent-green); color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: 700; margin-top: 10px; transition: transform 0.2s; }
        .btn-submit:hover { transform: translateY(-2px); }
        .links { text-align: center; margin-top: 15px; }
        .links a { color: var(--primary); text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'index' %}" class="logo">🎯 QuizApp</a>
        <button id="themeToggle" class="theme-toggle-btn">🌙</button>
    </header>

    <div class="container">
        <div class="card">
            <h2>{% if edit_mode %}Редагувати{% else %}Нова{% endif %} вікторина</h2>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-submit">Зберегти</button>
            </form>
            <div class="links">
                <a href="{% url 'index' %}">← На головну</a>
            </div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            btn.textContent = '☀️';
        }
        btn.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
            btn.textContent = isDark ? '🌙' : '☀️';
        });
    </script>
</body>
</html>
